<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
        <button class="tab-btn" onclick="switchTab('add')">Registrar</button>
        <button class="tab-btn" onclick="switchTab('explore')">Explorar</button>
    </nav>

    <!-- PESTAÑA: DASHBOARD -->
    <section id="dashboard" class="tab-content active">
        <div class="card principal">
            <h3>Cuenta Principal</h3>
            <p id="checking-balance">0.00 €</p>
        </div>
        
        <div class="dashboard-split">
            <div class="card liquidity">
                <h3>Colchón Liquidez</h3>
                <p id="liquidity-balance">0.00 €</p>
            </div>
            <div class="card investment">
                <h3>Inversión L.P.</h3>
                <p id="investment-balance">0.00 €</p>
            </div>
        </div>

        <!-- Chivato Inteligente de Deuda -->
        <div id="debt-indicator" class="card debt zero-debt">
            <h3>Deuda Pendiente Ahorro</h3>
            <p id="debt-amount">0.00 €</p>
        </div>
    </section>

    <!-- PESTAÑA: REGISTRAR MOVIMIENTO -->
    <section id="add" class="tab-content">
        <form id="record-form">
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>Tipo de Movimiento</label>
                <select id="type" onchange="updateCategories()" required>
                    <option value="gasto">Gasto</option>
                    <option value="ingreso">Ingreso</option>
                    <option value="ahorro">Movimiento de Ahorro/Inversión</option>
                </select>
            </div>
            <div class="form-group" id="payment-method-group">
                <label>Origen de los fondos</label>
                <select id="payment-method">
                    <option value="principal">Cuenta Principal</option>
                    <option value="liquidez">Usar Colchón de Liquidez (Genera Deuda)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <select id="category" required></select>
            </div>
            <div class="form-group">
                <label>Importe (€)</label>
                <input type="number" id="amount" step="0.01" min="0.01" required>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <input type="text" id="description" placeholder="Ej. Cena con amigos, Casco moto...">
            </div>
            <button type="submit" class="btn-primary" id="save-btn">Guardar Movimiento</button>
        </form>
    </section>

    <!-- PESTAÑA: EXPLORAR Y FILTRAR -->
    <section id="explore" class="tab-content">
        <div class="filters">
            <select id="filter-type" onchange="renderRecords()">
                <option value="all">Todos los movimientos</option>
                <option value="gasto">Solo Gastos</option>
                <option value="ingreso">Solo Ingresos</option>
                <option value="ahorro">Ahorro e Inversión</option>
            </select>
        </div>
        <div id="records-list">
            <!-- Los registros se inyectan desde JS -->
        </div>
    </section>

    <!-- MODAL DE DETALLE Y ELIMINACIÓN -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">Detalle del Movimiento</h3>
            <p id="modal-desc"></p>
            <p id="modal-date"></p>
            <p id="modal-amount"></p>
            <p id="modal-category"></p>
            <button class="btn-danger" id="delete-btn">Eliminar Registro</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
