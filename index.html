<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Finanzas</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Configuración iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Finanzas">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Librería para Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <!-- Pantalla 1: Dashboard / Balance -->
        <main id="view-dashboard" class="view active">
            <h1 class="page-title">📊 Mi Balance</h1>
            
            <div class="balance-card">
                <p class="balance-label">Balance Total</p>
                <h2 id="balance-total">0,00 €</h2>
                <div class="balance-row">
                    <div class="ingresos-box">
                        <small>Ingresos</small>
                        <p id="total-ingresos" class="text-green">+0,00 €</p>
                    </div>
                    <div class="gastos-box">
                        <small>Gastos</small>
                        <p id="total-gastos" class="text-red">-0,00 €</p>
                    </div>
                </div>
            </div>

            <h2 class="section-title">Gastos por Categoría</h2>
            <div class="chart-container">
                <canvas id="gastosChart"></canvas>
            </div>
        </main>

        <!-- Pantalla 2: Registrar -->
        <main id="view-registrar" class="view">
            <h1 class="page-title">✍️ Nuevo Registro</h1>
            
            <div class="toggle-container">
                <button id="btn-gasto" class="toggle-btn active" type="button">Gasto</button>
                <button id="btn-ingreso" class="toggle-btn" type="button">Ingreso</button>
            </div>

            <div class="form-container">
                <form id="form-finanzas">
                    <div class="input-group">
                        <label>Cantidad (€)</label>
                        <input type="number" id="input-cantidad" step="0.01" placeholder="0.00" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Categoría</label>
                        <select id="select-categoria" required>
                            <!-- Se llena con JS dependiendo si es gasto o ingreso -->
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Método</label>
                        <select id="select-metodo" required>
                            <option value="Tarjeta">💳 Tarjeta</option>
                            <option value="Efectivo">💵 Efectivo</option>
                            <option value="Transferencia">🏦 Transferencia / Bizum</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Descripción (Opcional)</label>
                        <input type="text" id="input-descripcion" placeholder="Ej: Cena con amigos">
                    </div>

                    <button type="submit" id="btn-guardar" class="btn-primary btn-red">Registrar Gasto</button>
                </form>
            </div>
        </main>

        <!-- Pantalla 3: Historial -->
        <main id="view-historial" class="view">
            <h1 class="page-title">🕒 Movimientos</h1>
            <div id="historial-list" class="list-container"></div>
        </main>

        <!-- Navegación inferior iOS -->
        <nav class="tab-bar">
            <button class="tab-item active" onclick="navigate('view-dashboard', this)">
                <span class="icon">📊</span><span>Balance</span>
            </button>
            <button class="tab-item" onclick="navigate('view-registrar', this)">
                <span class="icon">➕</span><span>Registrar</span>
            </button>
            <button class="tab-item" onclick="navigate('view-historial', this)">
                <span class="icon">🕒</span><span>Historial</span>
            </button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
